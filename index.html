    <script>
      // Gracefully handle HMR WebSocket disconnection errors in dev iframe preview
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || e.reason.stack || String(e.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport') || reason.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>

    <div id="root"></div>

  </body>
